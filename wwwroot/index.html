<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="description" content="Professional expense tracker with income management, savings goals, and smart budgeting." />
    <title>AYExpenseTracker — Smart Finance</title>
    <base href="/AYExpenseTracker/" />

    <!-- Bootstrap -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- App CSS -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="wallet.png" />
    <link href="AYExpenseTracker.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.json">

    <style>
        /* === PROFESSIONAL SPLASH SCREEN === */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #0a0f1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 40px rgba(99,102,241,0.4);
            animation: logoPulse 2s ease-in-out infinite;
        }

        .splash-title {
            font-family: 'Inter', sans-serif;
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.04em;
            margin-bottom: 0.25rem;
        }

        .splash-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 3rem;
            font-weight: 600;
        }

        /* === ELEGANT LOADING BAR === */
        .splash-progress-track {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .splash-progress-bar {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            border-radius: 9999px;
            animation: progressLoad 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            box-shadow: 0 0 12px rgba(99,102,241,0.6);
        }

        .splash-status {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 1rem;
            letter-spacing: 0.05em;
            animation: textCycle 2.5s steps(1) forwards;
        }

        /* === CIRCULAR PROGRESS (inner pages) === */
        .loading-progress {
            width: 60px;
            height: 60px;
            transform: rotate(-90deg);
        }

        .loading-progress .track {
            fill: none;
            stroke: rgba(255,255,255,0.06);
            stroke-width: 4;
        }

        .loading-progress .progress {
            fill: none;
            stroke: url(#progressGradient);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 170;
            stroke-dashoffset: 165;
            animation: progress-spin 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            filter: drop-shadow(0 0 6px rgba(99,102,241,0.8));
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(99,102,241,0.3); }
            50% { box-shadow: 0 0 60px rgba(99,102,241,0.6); }
        }

        @keyframes progressLoad {
            0% { width: 0%; }
            30% { width: 40%; }
            65% { width: 75%; }
            90% { width: 92%; }
            100% { width: 100%; }
        }

        @keyframes textCycle {
            0% { content: 'Initializing...'; opacity: 0.5; }
            30% { content: 'Loading data...'; opacity: 0.7; }
            65% { content: 'Preparing app...'; opacity: 0.9; }
            100% { content: 'Ready!'; opacity: 1; }
        }

        @keyframes progress-spin {
            0% { stroke-dashoffset: 165; }
            50% { stroke-dashoffset: 35; }
            100% { stroke-dashoffset: 165; }
        }

        /* === BLAZOR LOADING (fallback while WASM loads) === */
        #app {
            min-height: 100vh;
            background: #0a0f1e;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0a0f1e;
        }

        #blazor-error-ui {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 12px;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            color: #f1f5f9;
            display: none;
            padding: 0.75rem 1.25rem;
            position: fixed;
            width: auto;
            max-width: 90%;
            z-index: 10000;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
        }

        #blazor-error-ui.blazor-error-show { display: flex; gap: 1rem; align-items: center; }
        #blazor-error-ui a { color: #818cf8; }
        #blazor-error-ui .dismiss { cursor: pointer; color: #94a3b8; }
    </style>
</head>

<body>

    <!-- === PROFESSIONAL SPLASH SCREEN === -->
    <div id="splash-screen">
        <div class="splash-logo">💰</div>
        <div class="splash-title">AYExpenseTracker</div>
        <div class="splash-subtitle">Smart Finance Manager</div>
        <div class="splash-progress-track">
            <div class="splash-progress-bar"></div>
        </div>
        <div class="splash-status" id="splash-status-text">Initializing...</div>
    </div>

    <div id="app">
        <div class="loading-container">
            <svg class="loading-progress">
                <defs>
                    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#6366f1" />
                        <stop offset="100%" stop-color="#10b981" />
                    </linearGradient>
                </defs>
                <circle class="track" r="27" cx="30" cy="30" />
                <circle class="progress" r="27" cx="30" cy="30" />
            </svg>
            <div class="loading-text" style="color:#94a3b8; font-family:'Inter',sans-serif; font-size:0.8rem; margin-top:1rem; letter-spacing:0.1em;">LOADING</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        ⚠ An error occurred. <a href="." class="reload">Reload</a>
        <span class="dismiss">✕</span>
    </div>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <!-- Scripts -->
    <script src="js/pwa.js"></script>
    <script src="js/camera.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // === SPLASH SCREEN LIFECYCLE ===
        const statusMessages = ['Initializing...', 'Loading app...', 'Syncing data...', 'Almost ready...'];
        let msgIndex = 0;
        const statusEl = document.getElementById('splash-status-text');
        const msgInterval = setInterval(() => {
            msgIndex = (msgIndex + 1) % statusMessages.length;
            if (statusEl) statusEl.textContent = statusMessages[msgIndex];
        }, 700);

        function hideSplash() {
            clearInterval(msgInterval);
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 700);
            }
        }

        // Hide after Blazor is ready (Blazor fires this event)
        window.addEventListener('blazor:init', () => setTimeout(hideSplash, 400));
        // Fallback: hide after 4 seconds max
        setTimeout(hideSplash, 4000);

        // OCR
        window.ocr = {
            recognize: async function (base64Image) {
                try {
                    const img = new Image();
                    img.src = base64Image;
                    await new Promise(r => img.onload = r);
                    const canvas = document.createElement("canvas");
                    const scale = 2;
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                        data[i] = data[i + 1] = data[i + 2] = avg;
                    }
                    ctx.putImageData(imageData, 0, 0);
                    const processedBase64 = canvas.toDataURL();
                    const { data: { words } } = await Tesseract.recognize(processedBase64, 'eng+ara', {
                        logger: m => console.log(m),
                        tessedit_char_whitelist: '0123456789.,',
                        tessedit_pageseg_mode: Tesseract.PSM.AUTO
                    });
                    return words.map(w => ({ text: w.text, x: w.bbox.x0, y: w.bbox.y0, width: w.bbox.x1 - w.bbox.x0, height: w.bbox.y1 - w.bbox.y0 }));
                } catch (err) {
                    console.error("OCR failed:", err);
                    return [];
                }
            }
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('firebase-messaging-sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.error('SW failed:', err));
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>

    <script type="module" src="js/push-notifications.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/site.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        window.downloadExcelFromBlazor = function (filename, json) {
            const ws = XLSX.utils.json_to_sheet(JSON.parse(json));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Expenses");
            XLSX.writeFile(wb, filename);
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        window.renderExpensesChart = (ctxId, labels, data) => {
            const ctx = document.getElementById(ctxId)?.getContext('2d');
            if (!ctx) return;
            if (window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Amount', data: data, backgroundColor: 'rgba(99,102,241,0.5)', borderColor: '#6366f1', borderWidth: 2, borderRadius: 8 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', callbacks: { label: ctx => `${ctx.raw.toLocaleString()} KWD` } } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        };

        window.renderPieChart = (ctxId, labels, data) => {
            const ctx = document.getElementById(ctxId)?.getContext('2d');
            if (!ctx) return;
            if (window['chart_' + ctxId]) window['chart_' + ctxId].destroy();
            const colors = ['#6366f1','#10b981','#f59e0b','#ef4444','#3b82f6','#8b5cf6','#ec4899','#14b8a6'];
            window['chart_' + ctxId] = new Chart(ctx, {
                type: 'doughnut',
                data: { labels, datasets: [{ data, backgroundColor: colors.slice(0, data.length), borderColor: '#0a0f1e', borderWidth: 2 }] },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#94a3b8', padding: 12, font: { size: 11 } } },
                        tooltip: { callbacks: { label: ctx => `${ctx.label}: ${ctx.raw.toFixed(2)} KWD` } }
                    }
                }
            });
        };

        window.renderLineChart = (ctxId, labels, data) => {
            const labelsArr = Array.from(labels);
            const dataArr = Array.from(data);
            const ctx = document.getElementById(ctxId)?.getContext('2d');
            if (!ctx) return;
            if (window['chart_' + ctxId]) window['chart_' + ctxId].destroy();
            window['chart_' + ctxId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsArr,
                    datasets: [{
                        data: dataArr,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99,102,241,0.1)',
                        borderWidth: 2,
                        pointRadius: 3,
                        pointBackgroundColor: '#6366f1',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8', maxRotation: 0 } }
                    }
                }
            });
        };

        window.clearChart = (ctxId) => {
            if (window['chart_' + ctxId]) { window['chart_' + ctxId].destroy(); delete window['chart_' + ctxId]; }
        };

        window.exportInsightsPDF = async () => {
            const element = document.querySelector('.insights-container') || document.body;
            const canvas = await html2canvas(element, { backgroundColor: '#0a0f1e', scale: 1.5 });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
            pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('insights.pdf');
        };
    </script>
</body>
</html>
